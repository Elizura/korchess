# Production overlay: nginx, certbot, and production-specific settings.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# Required environment variables (set in .env):
#   - NEXT_PUBLIC_API_BASE_URL: Public URL for API (e.g., https://korchess.com)
#   - NEXT_PUBLIC_GOOGLE_CLIENT_ID: Google OAuth client ID (if using Google auth)

services:
  backend:
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID}}
    environment:
      - NODE_ENV=production
      - API_INTERNAL_URL=http://backend:8000

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
      - ./deploy/nginx/html:/usr/share/nginx/html:ro
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
    depends_on:
      - frontend
      - backend

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
    entrypoint: ["certbot"]
