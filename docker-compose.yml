services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    volumes:
      - ${LICHESS_EVAL_DB_HOST_PATH}:/app/lmdb_cache:ro
    env_file:
      - .env

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "repository.celery_app:app", "worker", "--loglevel=info", "--concurrency=3"]
    volumes:
      - ${LICHESS_EVAL_DB_HOST_PATH}:/app/lmdb_cache:ro
    env_file:
      - .env
    environment:
      - ENGINE_POOL_SIZE=3
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    depends_on:
      - backend
    env_file:
      - .env
