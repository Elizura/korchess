# Per-client-IP request limits (this file is included inside http {}).
# Credential and email-code endpoints get a strict limit to slow down
# password guessing and email abuse; the rest of the API (including the
# token refresh and profile reads made on every page load) gets a looser one.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    server_name korchess.com www.korchess.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Always redirect to the apex host: the frontend's API URL and the
    # host-only auth cookie are both tied to korchess.com.
    location / {
        return 301 https://korchess.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name korchess.com;

    ssl_certificate /etc/letsencrypt/live/korchess.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/korchess.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    resolver 127.0.0.11 valid=10s;

    location ~ ^/api/v1/auth/(signin|signup|verify|resend-code|forgot-password|reset-password|google)$ {
        limit_req zone=auth burst=20 nodelay;

        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        limit_req zone=api burst=50 nodelay;

        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# www.korchess.com -> https://korchess.com (same certificate).
server {
    listen 443 ssl http2;
    server_name www.korchess.com;

    ssl_certificate /etc/letsencrypt/live/korchess.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/korchess.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    return 301 https://korchess.com$request_uri;
}
